<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firmware Updater</title>
  <style>
    :root {
      --bg: #0f141b;
      --card: #1a212a;
      --text: #e8ecf1;
      --muted: #8b95a5;
      --accent: #00d4a1;
      --warn: #ff9f43;
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1b2a36, var(--bg));
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 0.35rem; }
    h3 { margin: 0 0 0.6rem; }
    .sub { color: var(--muted); margin-bottom: 1.5rem; line-height: 1.45; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      margin-bottom: 1rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
    button, select {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-weight: 600;
      cursor: pointer;
      font: inherit;
    }
    button {
      background: var(--accent);
      color: #06261d;
    }
    button.secondary { background: #2a3542; color: var(--text); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    select {
      background: #0c1117;
      color: var(--text);
      border: 1px solid #2a3542;
      min-width: 12rem;
      max-width: 100%;
    }
    .log {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      color: #c9d3df;
      max-height: 280px;
      overflow: auto;
      margin: 0;
    }
    .bar {
      height: 10px;
      background: #0c1117;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.8rem;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #109974, var(--accent));
    }
    .note { color: var(--muted); font-size: 0.9rem; }
    .warn { color: var(--warn); }
    .err { color: var(--err); }
    #releaseListWrap { display: none; margin-top: 0.8rem; }
  </style>
</head>
<body>
<main>
  <h1>Firmware Updater</h1>
  <p class="sub">Loads latest Release, then flashes over USB Serial.</p>

  <div class="card">
    <h3>Release</h3>
    <div class="row">
      <button id="btnLatest" class="secondary" type="button">Load latest release</button>
      <button id="btnPrev" class="secondary" type="button">View previous releases</button>
      <span id="relInfo" class="note">No release loaded</span>
    </div>
    <div id="releaseListWrap">
      <div class="row">
        <select id="releaseSelect" aria-label="Previous releases"></select>
        <button id="btnLoadSelected" type="button">Load selected</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>USB</h3>
    <div class="row">
      <button id="btnConnect" type="button">Connect USB</button>
      <button id="btnDisconnect" class="secondary" type="button" disabled>Disconnect USB</button>
      <button id="btnHello" class="secondary" type="button" disabled>Ping Remote</button>
      <span id="conn" class="note">Disconnected</span>
    </div>
  </div>

  <div class="card">
    <h3>Update Remote</h3>
    <p id="nameRemote" class="note">Load a release first</p>
    <div class="row">
      <button id="btnFlashRemote" type="button" disabled>Flash Remote</button>
    </div>
  </div>

  <div class="card">
    <h3>Update Jockey(s)</h3>
    <p class="note">Sends <code>jockey.bin</code> to every online paired Jockey.</p>
    <p id="nameJockey" class="note">Load a release first</p>
    <p id="jockeyOnline" class="note">Ping Remote to check online Jockeys</p>
    <div class="row">
      <button id="btnFlashJockey" type="button" disabled>Flash Jockeys</button>
    </div>
  </div>

  <div class="card">
    <h3>Status</h3>
    <div class="bar"><i id="prog"></i></div>
    <pre class="log" id="log"></pre>
  </div>
</main>
<script>
(() => {
  const GH_OWNER = "musman5921";
  const GH_REPO = "OTA-Test";
  const ASSET_REMOTE = "remote.bin";
  const ASSET_JOCKEY = "jockey.bin";

  const MAGIC = 0x31545557; // WUT1
  const CHUNK = 1024;
  const MSG = {
    HELLO: 1, HELLO_ACK: 2, BEGIN: 3, BEGIN_ACK: 4,
    DATA: 5, DATA_ACK: 6, COMMIT: 7, COMMIT_ACK: 8, ABORT: 9, PROGRESS: 10
  };
  const TARGET = { SELF: 1, JOCKEY: 2 };
  const ST = {
    0: "OK", 1: "BAD_ARG", 2: "BUSY", 3: "NO_MEM", 4: "FLASH",
    5: "CRC", 6: "ALREADY", 7: "NO_JOCKEY", 8: "JOCKEY_FAIL", 9: "STATE"
  };

  let port = null;
  let reader = null;
  let writer = null;
  let rxBuf = new Uint8Array(0);
  let remoteBin = null;
  let jockeyBin = null;
  let releaseTag = "";
  let remoteVersion = ""; // from last successful Ping
  let onlineJockeys = null; // null until Ping
  let pumping = false;

  const $ = (id) => document.getElementById(id);
  const logEl = $("log");
  const progEl = $("prog");

  function log(msg, cls) {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setProgress(frac) {
    progEl.style.width = `${Math.max(0, Math.min(100, frac * 100)).toFixed(1)}%`;
  }

  function syncUi() {
    const connected = !!port;
    $("btnConnect").disabled = connected;
    $("btnDisconnect").disabled = !connected;
    $("btnHello").disabled = !connected;
    $("btnFlashRemote").disabled = !(connected && remoteBin);
    $("btnFlashJockey").disabled = !(connected && jockeyBin);
    $("conn").textContent = connected ? "Connected" : "Disconnected";
    if (onlineJockeys == null) {
      $("jockeyOnline").textContent = "Ping Remote to check online Jockeys";
    } else if (onlineJockeys === 0) {
      $("jockeyOnline").textContent = "No online Jockey available";
      $("jockeyOnline").className = "note err";
    } else {
      $("jockeyOnline").textContent =
        `${onlineJockeys} online Jockey${onlineJockeys === 1 ? "" : "s"}`;
      $("jockeyOnline").className = "note";
    }
  }

  function fmtBytes(n) {
    if (n >= 1024 * 1024) return `${(n / (1024 * 1024)).toFixed(2)} MB`;
    if (n >= 1024) return `${(n / 1024).toFixed(1)} KB`;
    return `${n} B`;
  }

  /** Match device PROJECT_VER "1.0.13" with release tag "v1.0.13". */
  function sameVersion(a, b) {
    const core = (s) => String(s || "").trim().replace(/^[vV]/, "").toLowerCase();
    const ca = core(a);
    const cb = core(b);
    return ca.length > 0 && ca === cb;
  }

  /** CRC32 matching esp_rom_crc32_le(0, buf, len) / zlib.crc32. */
  function crc32Esp(buf) {
    let c = 0xffffffff;
    for (let i = 0; i < buf.length; i++) {
      c ^= buf[i];
      for (let k = 0; k < 8; k++) {
        c = (c >>> 1) ^ (0xedb88320 & -(c & 1));
      }
    }
    return (c ^ 0xffffffff) >>> 0;
  }

  function u16(n) { return n & 0xffff; }
  function u32(n) { return n >>> 0; }

  function encodeHdr({ msg, target = 0, status = 0, seq = 0, chunkLen = 0, totalLen = 0, crc32 = 0 }) {
    const b = new ArrayBuffer(20);
    const v = new DataView(b);
    v.setUint32(0, MAGIC, true);
    v.setUint8(4, msg);
    v.setUint8(5, target);
    v.setUint8(6, status);
    v.setUint8(7, 0);
    v.setUint16(8, u16(seq), true);
    v.setUint16(10, u16(chunkLen), true);
    v.setUint32(12, u32(totalLen), true);
    v.setUint32(16, u32(crc32), true);
    return new Uint8Array(b);
  }

  function concat(a, b) {
    const o = new Uint8Array(a.length + b.length);
    o.set(a, 0); o.set(b, a.length);
    return o;
  }

  function parseHdr(bytes, off = 0) {
    const v = new DataView(bytes.buffer, bytes.byteOffset + off, 20);
    return {
      magic: v.getUint32(0, true),
      msg: v.getUint8(4),
      target: v.getUint8(5),
      status: v.getUint8(6),
      seq: v.getUint16(8, true),
      chunkLen: v.getUint16(10, true),
      totalLen: v.getUint32(12, true),
      crc32: v.getUint32(16, true)
    };
  }

  async function pumpRead() {
    pumping = true;
    try {
      while (port && reader) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value && value.length) rxBuf = concat(rxBuf, value);
      }
    } catch (_) {
      /* port closed */
    } finally {
      pumping = false;
    }
  }

  function takeFrame(wantMsg, timeoutMs = 8000) {
    return new Promise((resolve, reject) => {
      const t0 = Date.now();
      const tick = () => {
        let i = 0;
        while (i + 20 <= rxBuf.length) {
          const h = parseHdr(rxBuf, i);
          if (h.magic !== MAGIC) { i++; continue; }
          const need = 20 + h.chunkLen;
          if (i + need > rxBuf.length) break;
          const body = rxBuf.slice(i + 20, i + need);
          rxBuf = rxBuf.slice(i + need);
          if (wantMsg == null || h.msg === wantMsg) {
            resolve({ hdr: h, body });
            return;
          }
          if (wantMsg === MSG.COMMIT_ACK && h.msg === MSG.PROGRESS) {
            resolve({ hdr: h, body });
            return;
          }
          continue;
        }
        if (Date.now() - t0 > timeoutMs) {
          reject(new Error("timeout waiting for device ACK"));
          return;
        }
        setTimeout(tick, 20);
      };
      tick();
    });
  }

  async function writeBytes(u8) {
    if (!writer) throw new Error("USB not connected");
    await writer.write(u8);
  }

  /** Best-effort ABORT so a failed transfer does not leave the device BUSY. */
  async function sendAbort() {
    try {
      if (writer) await writeBytes(encodeHdr({ msg: MSG.ABORT }));
    } catch (_) { /* ignore */ }
  }

  async function disconnect() {
    try {
      if (reader) {
        try { await reader.cancel(); } catch (_) {}
        try { reader.releaseLock(); } catch (_) {}
      }
      if (writer) {
        try { writer.releaseLock(); } catch (_) {}
      }
      if (port) {
        try { await port.close(); } catch (_) {}
      }
    } finally {
      reader = null;
      writer = null;
      port = null;
      rxBuf = new Uint8Array(0);
      onlineJockeys = null;
      remoteVersion = "";
      syncUi();
    }
  }

  /**
   * Download firmware from same-origin Pages paths (Release CDN is CORS-blocked).
   * @param label remote.bin | jockey.bin
   * @param basePath e.g. "firmware" or "firmware/releases/v1.0.12"
   */
  async function downloadBin(label, basePath) {
    const url = new URL(`${basePath}/${label}`, window.location.href);
    url.searchParams.set("t", String(Date.now()));
    log(`Downloading ${label}…`);
    const res = await fetch(url.href, { cache: "no-store" });
    if (!res.ok) {
      throw new Error(
        `${label} not found for this release on the site (HTTP ${res.status}). ` +
        `Only mirrored releases can be loaded here.`
      );
    }
    const buf = new Uint8Array(await res.arrayBuffer());
    log(`${label}: ${fmtBytes(buf.length)} (${buf.length} bytes)`);
    return buf;
  }

  async function applyBins(tag, basePath) {
    remoteBin = null;
    jockeyBin = null;
    releaseTag = tag;
    $("nameRemote").textContent = "Loading…";
    $("nameJockey").textContent = "Loading…";
    $("relInfo").textContent = `Loading ${tag}…`;
    syncUi();

    remoteBin = await downloadBin(ASSET_REMOTE, basePath);
    $("nameRemote").textContent = `${ASSET_REMOTE} (${tag}) · ${fmtBytes(remoteBin.length)}`;
    jockeyBin = await downloadBin(ASSET_JOCKEY, basePath);
    $("nameJockey").textContent = `${ASSET_JOCKEY} (${tag}) · ${fmtBytes(jockeyBin.length)}`;
    $("relInfo").textContent = `Loaded ${tag}`;
    log("Firmware ready.", "warn");
    syncUi();
  }

  /** Load latest: prefer Pages mirror under firmware/. */
  async function loadLatestRelease() {
    $("btnLatest").disabled = true;
    $("btnPrev").disabled = true;
    $("releaseListWrap").style.display = "none";
    try {
      let apiTag = "";
      try {
        const res = await fetch(
          `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/releases/latest`,
          { headers: { Accept: "application/vnd.github+json" } }
        );
        if (res.ok) {
          const rel = await res.json();
          apiTag = rel.tag_name || "";
          log(`Latest GitHub release: ${apiTag || "?"}`);
        }
      } catch (_) { /* optional */ }

      let mirrorVer = "";
      try {
        const vRes = await fetch(
          new URL(`firmware/VERSION.txt?t=${Date.now()}`, window.location.href).href,
          { cache: "no-store" }
        );
        if (vRes.ok) mirrorVer = (await vRes.text()).trim();
      } catch (_) { /* optional */ }

      if (mirrorVer) log(`Site firmware: ${mirrorVer}`);
      if (apiTag && mirrorVer && apiTag !== mirrorVer) {
        log(`Site still has ${mirrorVer}; GitHub latest is ${apiTag}. Wait for mirror update.`, "warn");
      }

      const tag = mirrorVer || apiTag || "latest";
      await applyBins(tag, "firmware");
    } catch (e) {
      $("relInfo").textContent = "Failed to load release";
      $("nameRemote").textContent = "—";
      $("nameJockey").textContent = "—";
      remoteBin = null;
      jockeyBin = null;
      log(String(e), "err");
      syncUi();
    } finally {
      $("btnLatest").disabled = false;
      $("btnPrev").disabled = false;
    }
  }

  /** List releases from GitHub API; user picks one to load from Pages archive. */
  async function viewPreviousReleases() {
    $("btnLatest").disabled = true;
    $("btnPrev").disabled = true;
    try {
      log("Loading release list…");
      const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/releases?per_page=30`,
        { headers: { Accept: "application/vnd.github+json" } }
      );
      if (!res.ok) throw new Error(`Could not list releases (HTTP ${res.status})`);
      const list = await res.json();
      const sel = $("releaseSelect");
      sel.innerHTML = "";
      if (!Array.isArray(list) || list.length === 0) {
        throw new Error("No releases found");
      }
      for (const rel of list) {
        const tag = rel.tag_name || "";
        if (!tag) continue;
        const opt = document.createElement("option");
        opt.value = tag;
        opt.textContent = `${tag}${rel.prerelease ? " (pre)" : ""}`;
        sel.appendChild(opt);
      }
      $("releaseListWrap").style.display = "block";
      log(`Found ${sel.options.length} releases — pick one and Load selected.`);
    } catch (e) {
      log(String(e), "err");
    } finally {
      $("btnLatest").disabled = false;
      $("btnPrev").disabled = false;
    }
  }

  async function loadSelectedRelease() {
    const tag = $("releaseSelect").value;
    if (!tag) return;
    $("btnLoadSelected").disabled = true;
    try {
      // Latest site mirror lives at firmware/; older tags under firmware/releases/<tag>/.
      let mirrorVer = "";
      try {
        const vRes = await fetch(
          new URL(`firmware/VERSION.txt?t=${Date.now()}`, window.location.href).href,
          { cache: "no-store" }
        );
        if (vRes.ok) mirrorVer = (await vRes.text()).trim();
      } catch (_) {}

      const basePath =
        (mirrorVer && tag === mirrorVer) ? "firmware" : `firmware/releases/${tag}`;
      log(`Loading release ${tag}…`);
      await applyBins(tag, basePath);
    } catch (e) {
      log(String(e), "err");
      $("relInfo").textContent = `Failed: ${tag}`;
    } finally {
      $("btnLoadSelected").disabled = false;
    }
  }

  async function connect() {
    if (!("serial" in navigator)) {
      log("WebSerial unavailable — use Chrome or Edge on desktop.", "err");
      return;
    }
    if (port) await disconnect();
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    reader = port.readable.getReader();
    writer = port.writable.getWriter();
    rxBuf = new Uint8Array(0);
    pumpRead().catch(() => {});
    syncUi();
    log("USB connected. Wait a few seconds if the Remote just rebooted, then Ping Remote.");
    log("Use the USB Serial COM port.", "warn");
  }

  async function hello() {
    const attempts = 5;
    let lastErr = null;
    for (let i = 1; i <= attempts; i++) {
      try {
        rxBuf = new Uint8Array(0);
        await writeBytes(encodeHdr({ msg: MSG.HELLO }));
        const { hdr, body } = await takeFrame(MSG.HELLO_ACK, 4000);
        const ver = new TextDecoder().decode(body).replace(/\0+$/g, "");
        remoteVersion = ver;
        onlineJockeys = hdr.totalLen >>> 0;
        log(`Remote version ${ver || "?"} · online Jockeys: ${onlineJockeys}`);
        if (releaseTag) {
          log(`Loaded release: ${releaseTag}`);
          if (sameVersion(ver, releaseTag)) {
            log(`Remote already matches ${releaseTag} — Flash Remote will be skipped.`, "warn");
          }
        }
        syncUi();
        return;
      } catch (e) {
        lastErr = e;
        log(`Ping attempt ${i}/${attempts} failed — waiting…`, "warn");
        await new Promise((r) => setTimeout(r, 1500));
      }
    }
    throw new Error(
      `${lastErr || "Ping failed"}. Wait ~5s after Connect, use the USB Serial COM port, then try again.`
    );
  }

  async function transfer(bin, target, label) {
    const crc = crc32Esp(bin);
    log(`${label}: ${bin.length} bytes`);
    setProgress(0);
    const verBytes = new TextEncoder().encode(releaseTag || "");
    const beginHdr = encodeHdr({
      msg: MSG.BEGIN,
      target,
      chunkLen: verBytes.length,
      totalLen: bin.length,
      crc32: crc
    });
    await writeBytes(verBytes.length ? concat(beginHdr, verBytes) : beginHdr);
    let fr = await takeFrame(MSG.BEGIN_ACK, 30000);
    if (fr.hdr.status === 6) {
      throw new Error(
        target === TARGET.SELF
          ? `Remote already on ${releaseTag || "this version"} — skipped`
          : `All online Jockeys already on ${releaseTag || "this version"} — skipped`
      );
    }
    if (fr.hdr.status !== 0) {
      throw new Error(
        fr.hdr.status === 7
          ? "No online Jockey available"
          : `BEGIN failed: ${ST[fr.hdr.status] || fr.hdr.status}`
      );
    }
    let seq = 0;
    for (let off = 0; off < bin.length; off += CHUNK) {
      const chunk = bin.subarray(off, Math.min(bin.length, off + CHUNK));
      const hdr = encodeHdr({
        msg: MSG.DATA, target, seq, chunkLen: chunk.length, totalLen: bin.length, crc32: crc
      });
      await writeBytes(concat(hdr, chunk));
      fr = await takeFrame(MSG.DATA_ACK, 10000);
      while (fr.hdr.msg === MSG.PROGRESS) {
        fr = await takeFrame(MSG.DATA_ACK, 10000);
      }
      if (fr.hdr.status !== 0 || fr.hdr.seq !== seq) {
        throw new Error(`Transfer failed at chunk ${seq}`);
      }
      seq++;
      setProgress((off + chunk.length) / bin.length * 0.9);
    }
    await writeBytes(encodeHdr({ msg: MSG.COMMIT, target, totalLen: bin.length, crc32: crc }));
    fr = await takeFrame(MSG.COMMIT_ACK, 600000);
    while (fr.hdr.msg === MSG.PROGRESS) {
      log(`Forwarding to Jockey ${fr.hdr.seq}…`);
      fr = await takeFrame(MSG.COMMIT_ACK, 600000);
    }
    if (fr.hdr.status !== 0) {
      throw new Error(
        fr.hdr.status === 7
          ? "No online Jockey available"
          : fr.hdr.status === 6
            ? `Already on ${releaseTag || "this version"} — skipped`
            : `Commit failed: ${ST[fr.hdr.status] || fr.hdr.status}`
      );
    }
    setProgress(1);
    log(`${label}: done`, "warn");
  }

  $("btnLatest").onclick = () => loadLatestRelease();
  $("btnPrev").onclick = () => viewPreviousReleases();
  $("btnLoadSelected").onclick = () => loadSelectedRelease();
  $("btnConnect").onclick = () => connect().catch((e) => log(String(e), "err"));
  $("btnDisconnect").onclick = () => {
    disconnect()
      .then(() => log("USB disconnected."))
      .catch((e) => log(String(e), "err"));
  };
  $("btnHello").onclick = () => hello().catch((e) => log(String(e), "err"));

  $("btnFlashRemote").onclick = async () => {
    if (!remoteBin) return;
    $("btnFlashRemote").disabled = true;
    $("btnFlashJockey").disabled = true;
    try {
      await hello();
      if (releaseTag && remoteVersion && sameVersion(remoteVersion, releaseTag)) {
        log(`Remote already on ${remoteVersion} — skipped.`, "warn");
        return;
      }
      await transfer(remoteBin, TARGET.SELF, "Remote");
      log("Remote will reboot into the new image.");
      log("USB will disconnect — Connect USB again, Ping, then Flash Jockeys if needed.", "warn");
      await disconnect();
    } catch (e) {
      const msg = String(e);
      log(msg, msg.includes("skipped") ? "warn" : "err");
      if (!msg.includes("skipped")) await sendAbort();
    } finally {
      syncUi();
    }
  };

  $("btnFlashJockey").onclick = async () => {
    if (!jockeyBin) return;
    $("btnFlashRemote").disabled = true;
    $("btnFlashJockey").disabled = true;
    try {
      await hello();
      if (onlineJockeys === 0) {
        throw new Error("No online Jockey available");
      }
      await transfer(jockeyBin, TARGET.JOCKEY, "Jockey");
      log("Online Jockeys should reboot if the update succeeded.");
    } catch (e) {
      const msg = String(e);
      log(msg, msg.includes("skipped") ? "warn" : "err");
      if (!msg.includes("skipped")) await sendAbort();
    } finally {
      syncUi();
    }
  };

  if (!("serial" in navigator)) {
    log("Open this page in Chrome or Edge on a desktop OS.", "err");
  }
  syncUi();
  log("Choose Load latest release or View previous releases to begin.");
})();
</script>
</body>
</html>
